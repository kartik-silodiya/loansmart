<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LoanSmart{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #2563eb;
            --brand-indigo: #4f46e5;
            --ink: #172033;
            --muted: #64748b;
            --soft-blue: #eff6ff;
            --line: #e5e7eb;
        }

        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 28rem),
                linear-gradient(180deg, #f8fbff 0%, #eef3fb 100%);
            color: var(--ink);
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: 0;
        }

        .navbar {
            background: linear-gradient(90deg, var(--brand-blue), var(--brand-indigo));
            box-shadow: 0 16px 36px rgba(37, 99, 235, 0.28);
        }

        .navbar .navbar-brand,
        .navbar .nav-link {
            color: #ffffff;
        }

        .navbar .nav-link {
            border-radius: 999px;
            font-weight: 700;
            margin-left: 0.35rem;
            padding: 0.55rem 1rem;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link:focus {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.45);
        }

        .navbar-toggler:focus {
            box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.25);
        }

        .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        .page-shell {
            max-width: 1120px;
        }

        .form-card,
        .result-panel,
        .history-card {
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .badge-result {
            font-size: clamp(2rem, 5vw, 4rem);
            letter-spacing: 0;
        }

        .metric {
            background: var(--soft-blue);
            border: 1px solid #dbeafe;
            border-radius: 16px;
        }

        .btn {
            border-radius: 999px;
            font-weight: 700;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-gradient {
            background: linear-gradient(90deg, var(--brand-blue), var(--brand-indigo));
            border: 0;
            color: #ffffff;
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.25);
        }

        .btn-gradient:hover,
        .btn-gradient:focus {
            color: #ffffff;
            box-shadow: 0 18px 36px rgba(37, 99, 235, 0.34);
        }

        .form-control,
        .form-select {
            border-color: #d8e1ef;
            border-radius: 14px;
            padding: 0.78rem 0.95rem;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--brand-blue);
            box-shadow: 0 0 0 0.22rem rgba(37, 99, 235, 0.16);
        }

        .app-footer {
            color: var(--muted);
            font-size: 0.95rem;
        }

        @media (max-width: 991.98px) {
            .navbar .nav-link {
                margin: 0.3rem 0 0;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container page-shell">
        <a class="navbar-brand" href="{% url 'loan_app:form' %}">💰 LoanSmart</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'loan_app:form' %}">Apply</a>
                <a class="nav-link" href="{% url 'loan_app:history' %}">History</a>
                <a href="{% url 'loan_app:dashboard' %}">Dashboard</a>
            </div>
        </div>
    </div>
</nav>

<main class="container page-shell py-4 py-md-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

<footer class="app-footer text-center py-4">
    Built with Django + scikit-learn
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
